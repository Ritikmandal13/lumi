name: Build ESP32-S3 Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/build_firmware.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compile ESP32-S3 LiveKit WebRTC Firmware
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure safe directory
        run: git config --global --add safe.directory '*'

      - name: Build Firmware with ESP-IDF
        working-directory: firmware/esp_idf_lumi
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Upload Compiled Binaries
        uses: actions/upload-artifact@v4
        with:
          name: lumi-esp32s3-binaries
          path: |
            firmware/esp_idf_lumi/build/bootloader/bootloader.bin
            firmware/esp_idf_lumi/build/partition_table/partition-table.bin
            firmware/esp_idf_lumi/build/lumi_robot.bin
