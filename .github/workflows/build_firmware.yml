name: Build ESP32-S3 Firmware

on:
  push:
    paths:
      - 'firmware/**'
      - '.github/workflows/build_firmware.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compile ESP32-S3 LiveKit WebRTC Firmware
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure safe directory
        run: git config --global --add safe.directory '*'

      - name: Build Firmware with ESP-IDF
        working-directory: firmware/esp_idf_lumi
        shell: bash
        run: |
          set -eo pipefail
          . $IDF_PATH/export.sh

          # Pre-resolve components and target
          idf.py set-target esp32s3 || true

          # Sanitize malformed sdkconfig.rename files in managed components to eliminate kconfgen syntax errors
          find managed_components -name "sdkconfig.rename" -exec truncate -s 0 {} + 2>/dev/null || true

          # Clean stale sdkconfig so all custom partitions and DTLS defaults are applied
          rm -f sdkconfig
          idf.py reconfigure

          # Patch LiveKit SDK engine.c to allow NULL capturer when publishing is data-only
          python3 patch_livekit.py
          find managed_components -name "engine.c" -exec grep -H "if (eng->options.media.capturer == NULL)" {} + || true

          # Build project and capture log
          idf.py build 2>&1 | tee build.log

          # Merge binaries into a single 1-click flasher binary at 0x0
          esptool.py --chip esp32s3 merge_bin -o build/lumi_merged.bin --flash_mode dio --flash_size 16MB 0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin 0x10000 build/lumi_robot.bin 2>&1 | tee -a build.log

      - name: Dump Failure Log to Summary
        if: failure()
        run: |
          echo "## ❌ ESP-IDF Build Failed" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 100 firmware/esp_idf_lumi/build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: idf-build-log
          path: firmware/esp_idf_lumi/build.log

      - name: Upload Compiled Binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumi-esp32s3-binaries
          if-no-files-found: error
          path: |
            firmware/esp_idf_lumi/build/lumi_merged.bin
            firmware/esp_idf_lumi/build/bootloader/bootloader.bin
            firmware/esp_idf_lumi/build/partition_table/partition-table.bin
            firmware/esp_idf_lumi/build/lumi_robot.bin

      - name: Log Build Success
        if: success()
        run: |
          echo "## 🎉 ESP32-S3 Firmware Compiled Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** ESP32-S3 (16MB Flash, 8MB Octal PSRAM)" >> $GITHUB_STEP_SUMMARY
          echo "- **App Partition:** 8MB (LiveKit WebRTC + Video Codec + Camera + OLED)" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifacts:** \`lumi_merged.bin\` (1-click web flasher at 0x0) and individual binaries" >> $GITHUB_STEP_SUMMARY

